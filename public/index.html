<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventia - MVP</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 16px; }
  .evento { border: 1px solid #ccc; padding: 12px; margin: 10px 0; }
  button { cursor: pointer; }
  #mensaje { margin: 10px 0; font-weight: bold; }
</style>
</head>
<body>
<h1>Eventia</h1>
<p>Usuario (id): <input id="usuario" type="number" value="2" style="width:60px"> (Ana López viene creada de ejemplo)</p>
<p><input id="q" placeholder="Buscar por título, descripción o ciudad"> <button onclick="cargar()">Buscar</button></p>
<div id="mensaje"></div>
<div id="eventos"></div>
<h2>Mis inscripciones</h2>
<button onclick="misInscripciones()">Ver mis inscripciones</button>
<ul id="inscripciones"></ul>
<script>
async function cargar() {
  const q = document.getElementById('q').value;
  const eventos = await (await fetch('/api/eventos?q=' + encodeURIComponent(q))).json();
  document.getElementById('eventos').innerHTML = eventos.map(e => `
    <div class="evento">
      <strong>${e.titulo}</strong> - ${e.ciudad} - ${e.fecha}<br>${e.descripcion || ''}<br>
      Cupos disponibles: <span id="cupo-${e.id}">${e.cupo_disponible}</span> de ${e.cupo_total}<br>
      <button onclick="inscribir(${e.id})" ${e.cupo_disponible === 0 ? 'disabled' : ''}>Inscribirme</button>
    </div>`).join('') || 'No se encontraron eventos.';
}
async function inscribir(evento_id) {
  const usuario_id = document.getElementById('usuario').value;
  const r = await fetch('/api/inscripciones', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario_id, evento_id }) });
  const data = await r.json();
  document.getElementById('mensaje').textContent = r.ok ? data.mensaje + '. Se envió la confirmación.' : 'Error: ' + data.error;
  cargar();
}
async function misInscripciones() {
  const id = document.getElementById('usuario').value;
  const r = await fetch('/api/inscripciones/usuario/' + id);
  const lista = await r.json();
  document.getElementById('inscripciones').innerHTML = r.ok
    ? (lista.map(i => `<li>${i.titulo} - ${i.ciudad} - ${i.fecha}</li>`).join('') || '<li>Sin inscripciones</li>')
    : '<li>' + lista.error + '</li>';
}
cargar();
</script>
</body>
</html>
